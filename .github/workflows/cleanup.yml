name: Cleanup

on:
  workflow_dispatch:
    inputs:
      provider:
        description: 'Cloud provider to destroy'
        required: true
        type: choice
        options: [both, aws, gcp]
        default: aws
      env:
        description: 'Target environment'
        required: true
        type: choice
        options: [dev, stage, prod]
      confirm:
        description: 'Type "destroy" to confirm'
        required: true

env:
  TERRAFORM_VERSION: "1.9.0"
  TERRAGRUNT_VERSION: "0.67.0"

jobs:
  confirm:
    name: Validate confirmation
    runs-on: ubuntu-latest
    steps:
      - name: Check confirmation input
        run: |
          if [ "${{ inputs.confirm }}" != "destroy" ]; then
            echo "❌ Confirmation failed. You must type 'destroy' to proceed."
            exit 1
          fi
          echo "✅ Confirmation accepted."

  config:
    name: Resolve config
    runs-on: ubuntu-latest
    needs: [confirm]
    outputs:
      providers: ${{ steps.resolve.outputs.providers }}
    steps:
      - name: Resolve providers
        id: resolve
        run: |
          PROVIDER="${{ inputs.provider }}"
          if [ "$PROVIDER" = "both" ]; then
            echo 'providers=["aws","gcp"]' >> $GITHUB_OUTPUT
          else
            echo "providers=[\"$PROVIDER\"]" >> $GITHUB_OUTPUT
          fi

  destroy:
    name: "[${{ matrix.provider }} / ${{ inputs.env }}] Destroy"
    runs-on: ubuntu-latest
    needs: [config]
    strategy:
      fail-fast: false
      matrix:
        provider: ${{ fromJson(needs.config.outputs.providers) }}

    environment: ${{ inputs.env }}

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Install Terragrunt
        run: |
          curl -sL "https://github.com/gruntwork-io/terragrunt/releases/download/v${{ env.TERRAGRUNT_VERSION }}/terragrunt_linux_amd64" \
            -o /usr/local/bin/terragrunt
          chmod +x /usr/local/bin/terragrunt

      - name: Auth AWS
        if: matrix.provider == 'aws'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_CLEANUP_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Auth GCP
        if: matrix.provider == 'gcp'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Destroy
        run: terragrunt run-all destroy --terragrunt-non-interactive
        working-directory: ${{ matrix.provider }}/${{ inputs.env }}
