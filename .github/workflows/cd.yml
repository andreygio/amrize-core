name: CD

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      provider:
        description: 'Cloud provider to deploy'
        required: false
        type: choice
        options: [both, aws, gcp]
        default: both
      env:
        description: 'Target environment'
        required: false
        type: choice
        options: [dev, stage, prod]
        default: dev

env:
  TERRAFORM_VERSION: "1.9.0"
  TERRAGRUNT_VERSION: "0.67.0"

jobs:
  config:
    name: Resolve deployment config
    runs-on: ubuntu-latest
    outputs:
      providers: ${{ steps.resolve.outputs.providers }}
      env:       ${{ steps.resolve.outputs.env }}
    steps:
      - name: Resolve inputs
        id: resolve
        run: |
          PROVIDER="${{ inputs.provider || 'both' }}"
          ENV="${{ inputs.env || 'dev' }}"

          if [ "$PROVIDER" = "both" ]; then
            echo 'providers=["aws","gcp"]' >> $GITHUB_OUTPUT
          else
            echo "providers=[\"$PROVIDER\"]" >> $GITHUB_OUTPUT
          fi

          echo "env=$ENV" >> $GITHUB_OUTPUT

  apply:
    name: "[${{ matrix.provider }} / ${{ needs.config.outputs.env }}] Apply"
    runs-on: ubuntu-latest
    needs: [config]
    strategy:
      fail-fast: true
      matrix:
        provider: ${{ fromJson(needs.config.outputs.providers) }}

    environment: ${{ needs.config.outputs.env }}

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Install Terragrunt
        run: |
          curl -sL "https://github.com/gruntwork-io/terragrunt/releases/download/v${{ env.TERRAGRUNT_VERSION }}/terragrunt_linux_amd64" \
            -o /usr/local/bin/terragrunt
          chmod +x /usr/local/bin/terragrunt

      - name: Auth AWS
        if: matrix.provider == 'aws'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_CD_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Auth GCP
        if: matrix.provider == 'gcp'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Apply
        run: terragrunt run-all apply --terragrunt-non-interactive
        working-directory: ${{ matrix.provider }}/${{ needs.config.outputs.env }}
