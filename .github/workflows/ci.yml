name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      provider:
        description: 'Cloud provider(s) to validate and plan'
        required: false
        type: choice
        options: [both, aws, gcp]
        default: aws

env:
  TERRAFORM_VERSION: "1.9.0"
  TERRAGRUNT_VERSION: "0.67.0"

jobs:
  config:
    name: Resolve config
    runs-on: ubuntu-latest
    outputs:
      providers: ${{ steps.resolve.outputs.providers }}
    steps:
      - name: Resolve providers
        id: resolve
        run: |
          PROVIDER="${{ inputs.provider || 'aws' }}"
          if [ "$PROVIDER" = "both" ]; then
            echo 'providers=["aws","gcp"]' >> $GITHUB_OUTPUT
          else
            echo "providers=[\"$PROVIDER\"]" >> $GITHUB_OUTPUT
          fi

  validate-plan:
    name: "[${{ matrix.provider }} / ${{ matrix.env }}] Validate & Plan"
    runs-on: ubuntu-latest
    needs: [config]
    strategy:
      fail-fast: false
      matrix:
        provider: ${{ fromJson(needs.config.outputs.providers) }}
        env: [dev]

    environment: ${{ matrix.env }}

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Install Terragrunt
        run: |
          curl -sL "https://github.com/gruntwork-io/terragrunt/releases/download/v${{ env.TERRAGRUNT_VERSION }}/terragrunt_linux_amd64" \
            -o /usr/local/bin/terragrunt
          chmod +x /usr/local/bin/terragrunt

      - name: Auth AWS
        if: matrix.provider == 'aws'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_CI_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Auth GCP
        if: matrix.provider == 'gcp'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Validate
        run: terragrunt run-all validate --terragrunt-non-interactive
        working-directory: ${{ matrix.provider }}/${{ matrix.env }}

      - name: Plan
        run: |
          terragrunt run-all plan --terragrunt-non-interactive \
            --terragrunt-exclude-dir "**/alb-controller" \
            --terragrunt-exclude-dir "**/argocd"
        working-directory: ${{ matrix.provider }}/${{ matrix.env }}
